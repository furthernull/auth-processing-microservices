spring.application.name=auth-api
server.port=8080
server.servlet.context-path=/api

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

app.jwt.secret=${JWT_SECRET:veryImportantApplicationSecretWordWithVeryLongName}
app.jwt.expiration=5000000
app.internal-token=${INTERNAL_TOKEN:secret-token}
app.data-api-url=${DATA_API_URL:http://localhost:8081}
